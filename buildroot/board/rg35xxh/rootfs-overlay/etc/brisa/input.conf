# Mapa dos botões do RG35XX H para a interface: BOTÃO = código evdev.
#
# O controle embutido ("ANBERNIC-keys") usa um bloco contínuo de códigos a
# partir de BTN_SOUTH (304), na ordem dos índices do perfil do RetroArch que
# vem no firmware stock (A=0, B=1, Y=2, X=3, L1=4, R1=5, SELECT=6, START=7,
# MENU=8, L3=9, L2=10, R2=11, R3=12). Direcional: hat (ABS_HAT0X/Y).
#
# Para corrigir sem recompilar, crie Brisa/input.conf no cartão de jogos
# (dá para editar no PC): ele é lido depois deste e vale por cima.
# Descubra os códigos em Ajustes > Testar controles. Aceita vários: "A = 304, 28".
A = 304
B = 305
Y = 306
X = 307
L1 = 308
R1 = 309
SELECT = 310
START = 311
MENU = 312
L2 = 314
R2 = 315
