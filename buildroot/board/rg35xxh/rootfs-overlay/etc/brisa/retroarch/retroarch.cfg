# Brisa OS: configuração padrão do RetroArch.
# Copiada para @DATA@/retroarch/retroarch.cfg no primeiro uso; edite a cópia.

# Vídeo: Mali-G31 direto no framebuffer
video_driver = "gl"
# nome do contexto no RetroArch 1.22 (gfx/drivers_context/mali_fbdev_ctx.c)
video_context_driver = "fbdev_mali"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
aspect_ratio_index = "22"
video_font_size = "24.000000"

# Áudio
audio_driver = "alsathread"
audio_latency = "64"
audio_sync = "true"

# Controles (perfis do firmware stock em /usr/share/brisa/autoconfig)
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/brisa/autoconfig"
# START + SELECT abre o menu do RetroArch. O perfil do stock (input-stock.cfg),
# carregado depois, troca para "segurar START" e define MENU + START para sair.
input_menu_toggle_gamepad_combo = "4"
# POWER (tratado pelo Brisa) sai do jogo salvando

# Pastas
libretro_directory = "/usr/lib/libretro"
system_directory = "@DATA@/bios"
savefile_directory = "@DATA@/saves"
savestate_directory = "@DATA@/states"
screenshot_directory = "@DATA@/screenshots"
core_options_path = "@DATA@/retroarch/retroarch-core-options.cfg"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"

# Menu leve e sem atualizadores online
menu_driver = "rgui"
rgui_show_start_screen = "false"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
quit_press_twice = "false"
config_save_on_exit = "false"
savestate_thumbnail_enable = "false"
pause_nonactive = "false"

# Permite que o Brisa mande comandos ao RetroArch (UDP 55355, só local)
network_cmd_enable = "true"
