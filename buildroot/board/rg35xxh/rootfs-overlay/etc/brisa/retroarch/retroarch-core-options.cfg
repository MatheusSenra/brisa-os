# Brisa OS: opções dos cores ajustadas para o H700 (4x Cortex-A53 @ 1,5 GHz).
# Copiadas para @DATA@/retroarch/ no primeiro uso.

# PlayStation: dynarec ARM64, GPU em thread separada, sem melhorias caras
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_gpu_thread_rendering = "async"
pcsx_rearmed_neon_enhancement_enable = "disabled"
pcsx_rearmed_frameskip_type = "disabled"
pcsx_rearmed_show_bios_bootlogo = "disabled"

# Mega Drive / Master System / 32X / Mega CD
picodrive_drc = "enabled"
picodrive_audio_filter = "disabled"

# Game Boy Advance
mgba_skip_bios = "ON"
mgba_frameskip = "disabled"
mgba_sgb_borders = "OFF"

# Game Boy / Color
gambatte_gb_colorization = "auto"
gambatte_gbc_color_correction = "GBC only"

# SNES: interpolação de áudio mais barata
snes9x_audio_interpolation = "linear"

# NES
fceumm_sndquality = "Low"
